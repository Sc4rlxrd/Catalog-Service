name: Catalog Service CI

on:
  pull_request:
    branches:
      - dev
      - master

  push:
    branches:
      - dev
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: books
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root

        ports:
          - 5433:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d books"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3-management-alpine

        env:
          RABBITMQ_DEFAULT_USER: book_user
          RABBITMQ_DEFAULT_PASS: book_password

        ports:
          - 5672:5672
          - 15672:15672

        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: dev
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"

      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/books
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_RABBITMQ_HOST: localhost
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: book_user
      SPRING_RABBITMQ_PASSWORD: book_password

      RABBITMQ_USERNAME: book_user
      RABBITMQ_PASSWORD: book_password

      RABBITMQ_CHART_PATH: .ci/bookcommerce-k8s-helm/charts/rabbitmq

    steps:
      - name: Checkout Catalog Service
        uses: actions/checkout@v6

      - name: Checkout Helm infrastructure
        uses: actions/checkout@v6
        with:
          repository: Sc4rlxrd/BookCommerce-K8s-Helm
          ref: master
          path: .ci/bookcommerce-k8s-helm
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render RabbitMQ definitions
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RABBITMQ_CHART_PATH}/templates/ci-definitions.yaml" <<'EOF'
          {{ tpl (.Files.Get "files/definitions.json.tpl") . }}
          EOF

          helm template rabbitmq-ci "${RABBITMQ_CHART_PATH}" \
            --show-only templates/ci-definitions.yaml \
            --set-string 'config.vhost=/' \
            --set-string 'secret.username=book_user' \
            --set-string 'secret.password=book_password' \
            --set-string 'secret.erlangCookie=ci-erlang-cookie' \
            | awk '
                found || /^[[:space:]]*\{/ {
                  found = 1
                  print
                }
              ' \
            > "${RUNNER_TEMP}/rabbitmq-definitions.json"

          python3 -m json.tool \
            "${RUNNER_TEMP}/rabbitmq-definitions.json" \
            > /dev/null

          echo "RabbitMQ definitions rendered successfully."

      - name: Wait for RabbitMQ Management API
        shell: bash
        run: |
          set -euo pipefail

          ready=false

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --user "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" \
              http://localhost:15672/api/overview \
              > /dev/null; then

              ready=true
              break
            fi

            echo "Waiting for RabbitMQ Management API..."
            sleep 2
          done

          if [[ "${ready}" != "true" ]]; then
            echo "RabbitMQ Management API did not become ready."
            exit 1
          fi

      - name: Import RabbitMQ topology
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --user "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" \
            --header "Content-Type: application/json" \
            --request POST \
            http://localhost:15672/api/definitions \
            --data-binary @"${RUNNER_TEMP}/rabbitmq-definitions.json"

          echo
          echo "RabbitMQ topology imported successfully."

      - name: Verify Catalog RabbitMQ queues
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --user "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" \
            http://localhost:15672/api/queues/%2F/book.validate.queue \
            > /dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            --user "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" \
            http://localhost:15672/api/queues/%2F/stock.decrease.queue \
            > /dev/null

          echo "Catalog Service RabbitMQ queues are available."

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-service-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Validate Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout Catalog Service
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: bookcommerce/catalog-service:ci
          cache-from: type=gha,scope=catalog-service
          cache-to: type=gha,mode=max,scope=catalog-service