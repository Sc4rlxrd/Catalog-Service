server:
  port: 8081

spring:
  application:
    name: catalog-service
  datasource:
    platform: postgres
    url: jdbc:postgresql://localhost:5433/books
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: book_user
    password: book_password

flyway:
  enabled: true
  locations: classpath:db/migration

jpa:
  hibernate:
    ddl-auto: validate # apenas valida/atualiza schema
    deferred-datasource-initialization: true


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"

logging:
#  level:
#    io.micrometer.tracing: DEBUG
#    zipkin: DEBUG
#    brave: DEBUG
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-} orderId=%X{orderId:-}] "
springdoc:
  api-docs:
    path: /v3/api-docs